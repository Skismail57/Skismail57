<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 160" width="1280" height="160" role="img" aria-label="S K Ismail Footer Banner">
  <defs>
    <style><![CDATA[
      text{font-family:'Consolas','SFMono-Regular','Liberation Mono',Menlo,monospace}
      @keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
      @keyframes glowLine{0%,100%{filter:drop-shadow(0 0 2px #22d3ee88)}50%{filter:drop-shadow(0 0 10px #8b5cf6cc)}}
      @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      .tw{transform-box:fill-box;transform-origin:center;animation:twinkle 2.6s ease-in-out infinite}
      .gl{animation:glowLine 3s ease-in-out infinite}
      .fl{animation:floaty 4.4s ease-in-out infinite}
    ]]></style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05080f"/>
      <stop offset="45%" stop-color="#0a1424"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="lineg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="22%" stop-color="#22d3ee" stop-opacity=".85"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="1"/>
      <stop offset="78%" stop-color="#60a5fa" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"><animate attributeName="stop-color" values="#22d3ee;#60a5fa;#8b5cf6;#22d3ee" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="50%"><animate attributeName="stop-color" values="#38bdf8;#a78bfa;#22d3ee;#38bdf8" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="100%"><animate attributeName="stop-color" values="#8b5cf6;#22d3ee;#60a5fa;#8b5cf6" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="subg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="cornerg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="160" fill="url(#bg)"/>

  <!-- Animated glow dividers -->
  <rect class="gl" x="0" y="12" width="1280" height="2.2" rx="1.1" fill="url(#lineg)"/>
  <rect class="gl" x="0" y="146" width="1280" height="2.2" rx="1.1" fill="url(#lineg)" style="animation-delay:1.5s"/>

  <!-- Twinkling stars -->
  <g class="tw" style="animation-delay:.1s"><path d="M64 36l1.8 4.8 4.8 1.8-4.8 1.8-1.8 4.8-1.8-4.8-4.8-1.8 4.8-1.8z" fill="#67e8f9"/></g>
  <g class="tw" style="animation-delay:.6s"><path d="M1196 42l2.4 6.4 6.4 2.4-6.4 2.4-2.4 6.4-2.4-6.4-6.4-2.4 6.4-2.4z" fill="#22d3ee"/></g>
  <g class="tw" style="animation-delay:1.1s"><path d="M220 128l2 5.4 5.4 2-5.4 2-2 5.4-2-5.4-5.4-2 5.4-2z" fill="#8b5cf6"/></g>
  <g class="tw" style="animation-delay:1.6s"><path d="M1086 120l1.6 4.2 4.2 1.6-4.2 1.6-1.6 4.2-1.6-4.2-4.2-1.6 4.2-1.6z" fill="#60a5fa"/></g>
  <g class="tw" style="animation-delay:2.1s"><path d="M640 28l1.3 3.4 3.4 1.3-3.4 1.3-1.3 3.4-1.3-3.4-3.4-1.3 3.4-1.3z" fill="#c4b5fd"/></g>
  <g class="tw" style="animation-delay:.3s"><path d="M404 40l1.8 4.6 4.6 1.8-4.6 1.8-1.8 4.6-1.8-4.6-4.6-1.8 4.6-1.8z" fill="#22d3ee"/></g>
  <g class="tw" style="animation-delay:1.3s"><path d="M880 36l1.6 4.2 4.2 1.6-4.2 1.6-1.6 4.2-1.6-4.2-4.2-1.6 4.2-1.6z" fill="#a78bfa"/></g>
  <g class="tw" style="animation-delay:2.4s"><path d="M748 130l1.4 3.6 3.6 1.4-3.6 1.4-1.4 3.6-1.4-3.6-3.6-1.4 3.6-1.4z" fill="#67e8f9"/></g>
  <g class="tw" style="animation-delay:.9s"><path d="M152 86l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5z" fill="#38bdf8"/></g>
  <g class="tw" style="animation-delay:1.9s"><path d="M1130 82l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5z" fill="#fbbf24" opacity=".85"/></g>

  <!-- Floating ornaments -->
  <g class="fl" style="animation-delay:.2s">
    <g transform="translate(150,86)">
      <circle r="9" fill="none" stroke="#c9d1d9" stroke-width="1.2" opacity=".45"/>
      <path d="M-9 0a9 9 0 1 0 18 0" fill="none" stroke="#22d3ee" stroke-width="1.2" opacity=".7"/>
    </g>
  </g>

  <g class="fl" style="animation-delay:.7s">
    <g transform="translate(1138,80)">
      <path d="M0-14l4.3 8.7l9.6 1.4l-6.9 6.7l1.6 9.6L0 3.5l-8.6 4.5L-7 -5.2l-8.4-4.8L-3.3 -3.9L0-14z" fill="#fbbf24" opacity=".5"/>
    </g>
  </g>

  <g class="fl" style="animation-delay:1.2s">
    <g transform="translate(88,110)">
      <path d="M-11-7 L11-7 L11 7 L0 0 Z" fill="#4ade80" opacity=".45"/>
    </g>
  </g>

  <g class="fl" style="animation-delay:1.7s">
    <g transform="translate(1198,112)">
      <rect x="-8" y="-8" width="16" height="16" rx="3" fill="none" stroke="#22d3ee" stroke-width="1.3" opacity=".55"/>
      <rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#8b5cf6" opacity=".4"/>
    </g>
  </g>

  <!-- Top small caption -->
  <text x="640" y="50" text-anchor="middle" font-size="11" fill="#64748b" letter-spacing="3">
    — // GITHUB PROFILE // —
  </text>

  <!-- Center name & tagline -->
  <g transform="translate(640, 90)">
    <text text-anchor="middle" y="0" font-size="24" font-weight="bold" fill="url(#nameg)" letter-spacing="1">
      ⚡  S K Ismail  ·  @Skismail57  ⚡
    </text>
    <text text-anchor="middle" y="28" font-size="14" fill="url(#subg)">
      Backend Developer   •   AI/ML Engineer   •   Cloud Native Builder
    </text>
    <text text-anchor="middle" y="48" font-size="11.5" fill="#64748b">
      Built with ⚡ Java · Spring Boot · Python · TensorFlow · React · Docker · Kubernetes &amp; pure SVG
    </text>
  </g>

  <!-- Corner brackets -->
  <g fill="none" stroke="url(#cornerg)" stroke-width="1.5" opacity=".7">
    <path d="M26 24 L26 12 L38 12"/>
    <path d="M1254 24 L1254 12 L1242 12"/>
    <path d="M26 136 L26 148 L38 148"/>
    <path d="M1254 136 L1254 148 L1242 148"/>
  </g>

  <!-- Bottom decorative dots -->
  <g fill="#22d3ee" opacity=".5">
    <circle cx="640" cy="150" r="1.5"/>
  </g>
  <g fill="#8b5cf6" opacity=".35">
    <circle cx="628" cy="150" r="1"/>
    <circle cx="652" cy="150" r="1"/>
  </g>
</svg>
