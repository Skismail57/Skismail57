<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 140" width="1280" height="140" role="img" aria-label="Footer">
  <defs>
    <style><![CDATA[
      text{font-family:'Consolas','SFMono-Regular','Liberation Mono',Menlo,monospace}
      @keyframes fadeIn{from{opacity:0}to{opacity:1}}
      @keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
      @keyframes glowLine{0%,100%{filter:drop-shadow(0 0 3px #22d3ee88)}50%{filter:drop-shadow(0 0 10px #8b5cf6cc)}}
      @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      .tw{transform-box:fill-box;transform-origin:center;animation:twinkle 2.6s ease-in-out infinite}
      .gl{animation:glowLine 3s ease-in-out infinite}
      .fl{animation:floaty 4s ease-in-out infinite}
    ]]></style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05080f"/>
      <stop offset="50%" stop-color="#0a1424"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="lineg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="25%" stop-color="#22d3ee" stop-opacity=".8"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="1"/>
      <stop offset="75%" stop-color="#60a5fa" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"><animate attributeName="stop-color" values="#22d3ee;#60a5fa;#8b5cf6;#22d3ee" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="50%"><animate attributeName="stop-color" values="#38bdf8;#a78bfa;#22d3ee;#38bdf8" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="100%"><animate attributeName="stop-color" values="#8b5cf6;#22d3ee;#60a5fa;#8b5cf6" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="140" fill="url(#bg)"/>

  <!-- Top glow line -->
  <rect class="gl" x="0" y="8" width="1280" height="2" rx="1" fill="url(#lineg)"/>

  <!-- Twinkling stars -->
  <g class="tw" style="animation-delay:.1s"><path d="M60 25l1.8 4.8 4.8 1.8-4.8 1.8-1.8 4.8-1.8-4.8-4.8-1.8 4.8-1.8z" fill="#67e8f9"/></g>
  <g class="tw" style="animation-delay:.7s"><path d="M1180 32l2.4 6.4 6.4 2.4-6.4 2.4-2.4 6.4-2.4-6.4-6.4-2.4 6.4-2.4z" fill="#22d3ee"/></g>
  <g class="tw" style="animation-delay:1.3s"><path d="M240 110l2 5.4 5.4 2-5.4 2-2 5.4-2-5.4-5.4-2 5.4-2z" fill="#8b5cf6"/></g>
  <g class="tw" style="animation-delay:1.9s"><path d="M1060 104l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5z" fill="#60a5fa"/></g>
  <g class="tw" style="animation-delay:2.5s"><path d="M640 22l1.2 3.2 3.2 1.2-3.2 1.2-1.2 3.2-1.2-3.2-3.2-1.2 3.2-1.2z" fill="#c4b5fd"/></g>
  <g class="tw" style="animation-delay:.3s"><path d="M420 30l1.8 4.6 4.6 1.8-4.6 1.8-1.8 4.6-1.8-4.6-4.6-1.8 4.6-1.8z" fill="#22d3ee"/></g>
  <g class="tw" style="animation-delay:1.1s"><path d="M900 28l1.6 4.2 4.2 1.6-4.2 1.6-1.6 4.2-1.6-4.2-4.2-1.6 4.2-1.6z" fill="#a78bfa"/></g>
  <g class="tw" style="animation-delay:2.2s"><path d="M780 112l1.4 3.6 3.6 1.4-3.6 1.4-1.4 3.6-1.4-3.6-3.6-1.4 3.6-1.4z" fill="#67e8f9"/></g>

  <!-- Floating icons -->
  <g class="fl" style="animation-delay:.2s">
    <g transform="translate(180,70)">
      <path d="M-12 0a12 12 0 1 0 24 0a12 12 0 1 0-24 0m18 0c0-3.3-2.7-6-6-6c-1 0-2 .3-2.7.8c-1.2-1-2.8-1.8-4.6-1.8c-3.9 0-7 3.1-7 7s3.1 7 7 7c1.8 0 3.4-.8 4.6-1.8c.7.5 1.7.8 2.7.8c3.3 0 6-2.7 6-6z" fill="#c9d1d9" opacity=".55"/>
    </g>
  </g>

  <g class="fl" style="animation-delay:.5s">
    <g transform="translate(1100,66)">
      <path d="M0-14l4.3 8.7l9.6 1.4l-6.9 6.7l1.6 9.6L0-2l-8.6 4.5L-7-4.2l-8.4-4.8L-3.3-2.9L0-14z" fill="#fbbf24" opacity=".45"/>
    </g>
  </g>

  <g class="fl" style="animation-delay:.8s">
    <g transform="translate(100,95)">
      <path d="M-11-7 L11-7 L11 7 L0 0 Z" fill="#4ade80" opacity=".4"/>
    </g>
  </g>

  <!-- Center content -->
  <g transform="translate(640, 64)">
    <text text-anchor="middle" y="-10" font-size="13" fill="#6b7b8f">~//</text>
    <text text-anchor="middle" y="14" font-size="22" font-weight="bold" fill="url(#nameg)">
      ⚡ S K Ismail · Skismail57 ⚡
    </text>
    <text text-anchor="middle" y="40" font-size="13" fill="#94a3b8">
      Backend Developer &nbsp; • &nbsp; AI/ML Engineer &nbsp; • &nbsp; Cloud Native Builder
    </text>
    <text text-anchor="middle" y="60" font-size="11" fill="#6b7b8f">
      Built with ⚡ React, Tailwind, Spring Boot, TensorFlow, Kubernetes &amp; pure SVG ✨
    </text>
  </g>

  <!-- Bottom glow line -->
  <rect class="gl" x="0" y="130" width="1280" height="2" rx="1" fill="url(#lineg)" style="animation-delay:1.5s"/>

  <!-- Corner ornaments -->
  <g opacity=".5" fill="none" stroke="url(#nameg)" stroke-width="1.2">
    <path d="M18 30 L18 18 L30 18"/>
    <path d="M1262 30 L1262 18 L1250 18"/>
    <path d="M18 110 L18 122 L30 122"/>
    <path d="M1262 110 L1262 122 L1250 122"/>
  </g>
</svg>
