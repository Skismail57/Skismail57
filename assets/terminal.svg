<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="Live Terminal">
  <defs>
    <style><![CDATA[
      text{font-family:'Consolas','SFMono-Regular','Liberation Mono',Menlo,monospace}
      @keyframes fadeSlide{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 2px #22d3eecc)}50%{filter:drop-shadow(0 0 8px #22d3eeff)}}
      @keyframes shine{0%{transform:translateX(-940px) skewX(-18deg)}55%,100%{transform:translateX(940px) skewX(-18deg)}}
      .ln{opacity:0;animation:fadeSlide .35s ease forwards}
      .cur{animation:blink 1s step-end infinite}
      .gp{animation:glowPulse 2.8s ease-in-out infinite}
      .sh{animation:shine 5s ease-in-out infinite}
    ]]></style>
    <linearGradient id="titleg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"><animate attributeName="stop-color" values="#22d3ee;#8b5cf6;#22d3ee" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="100%"><animate attributeName="stop-color" values="#8b5cf6;#22d3ee;#8b5cf6" dur="7s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="termg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1728"/>
      <stop offset="100%" stop-color="#070c16"/>
    </linearGradient>
    <linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".05"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cc"><rect x="1" y="1" width="898" height="518" rx="18"/></clipPath>
  </defs>

  <rect x="1" y="1" width="898" height="518" rx="18" fill="#0a1424" stroke="url(#titleg)" stroke-width="1.5"/>

  <!-- Terminal window -->
  <rect x="30" y="30" width="840" height="460" rx="14" fill="url(#termg)" stroke="#1c2b3d" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="30" y="30" width="840" height="42" rx="14" fill="#0f1e36"/>
  <rect x="30" y="54" width="840" height="18" fill="#0f1e36"/>
  <circle cx="54" cy="51" r="7" fill="#ff5f57"/>
  <circle cx="76" cy="51" r="7" fill="#febc2e"/>
  <circle cx="98" cy="51" r="7" fill="#28c840"/>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#6b7b8f" font-weight="bold">skismail57@github ~ zsh — 120×34</text>

  <!-- Terminal lines -->
  <g font-size="15" fill="#c9d1d9">
    <!-- Line 1: whoami -->
    <g class="ln" style="animation-delay:.2s">
      <tspan x="58" y="100" fill="#22d3ee" font-weight="bold">skismail57@github</tspan>
      <tspan fill="#6b7b8f">:</tspan>
      <tspan fill="#8b5cf6" font-weight="bold">~</tspan>
      <tspan fill="#6b7b8f">$ </tspan>
      <tspan fill="#fef3c7">whoami</tspan>
    </g>
    <g class="ln" style="animation-delay:.45s">
      <tspan x="58" y="126" fill="#c4b5fd">S K Ismail — Backend Developer • AI/ML Engineer</tspan>
    </g>

    <!-- Line 2: skills -->
    <g class="ln" style="animation-delay:.7s">
      <tspan x="58" y="162" fill="#22d3ee" font-weight="bold">skismail57@github</tspan>
      <tspan fill="#6b7b8f">:</tspan>
      <tspan fill="#8b5cf6" font-weight="bold">~</tspan>
      <tspan fill="#6b7b8f">$ </tspan>
      <tspan fill="#fef3c7">cat /etc/skills.conf</tspan>
    </g>
    <g class="ln" style="animation-delay:.95s">
      <tspan x="58" y="188" fill="#7dd3fc">LANGUAGES=</tspan>
      <tspan fill="#4ade80">Java, Python, JavaScript, TypeScript, SQL</tspan>
    </g>
    <g class="ln" style="animation-delay:1.15s">
      <tspan x="58" y="210" fill="#7dd3fc">FRAMEWORKS=</tspan>
      <tspan fill="#4ade80">Spring Boot, FastAPI, React, TensorFlow, PyTorch</tspan>
    </g>
    <g class="ln" style="animation-delay:1.35s">
      <tspan x="58" y="232" fill="#7dd3fc">DEVOPS=</tspan>
      <tspan fill="#4ade80">Docker, Kubernetes, AWS, Jenkins, Terraform</tspan>
    </g>
    <g class="ln" style="animation-delay:1.55s">
      <tspan x="58" y="254" fill="#7dd3fc">DATABASES=</tspan>
      <tspan fill="#4ade80">MySQL, PostgreSQL, Redis</tspan>
    </g>

    <!-- Line 3: system status -->
    <g class="ln" style="animation-delay:1.85s">
      <tspan x="58" y="290" fill="#22d3ee" font-weight="bold">skismail57@github</tspan>
      <tspan fill="#6b7b8f">:</tspan>
      <tspan fill="#8b5cf6" font-weight="bold">~</tspan>
      <tspan fill="#6b7b8f">$ </tspan>
      <tspan fill="#fef3c7">systemctl status productivity.service</tspan>
    </g>
    <g class="ln" style="animation-delay:2.15s">
      <tspan x="58" y="318" fill="#4ade80" font-weight="bold">●</tspan>
      <tspan fill="#c9d1d9" font-weight="bold"> productivity.service — Shipping Code &amp; Training Models</tspan>
    </g>
    <g class="ln" style="animation-delay:2.4s">
      <tspan x="58" y="340" fill="#94a3b8">     Active: </tspan>
      <tspan fill="#4ade80" font-weight="bold">active (running) </tspan>
      <tspan fill="#94a3b8">since Mon 2026-08-03 09:24:10 IST; 42min ago</tspan>
    </g>
    <g class="ln" style="animation-delay:2.6s">
      <tspan x="58" y="362" fill="#94a3b8">     Tasks: </tspan>
      <tspan fill="#fdba74">200+</tspan>
      <tspan fill="#94a3b8">  commits, </tspan>
      <tspan fill="#7dd3fc">5+</tspan>
      <tspan fill="#94a3b8">  repos, </tspan>
      <tspan fill="#8b5cf6">6+</tspan>
      <tspan fill="#94a3b8">  ML models</tspan>
    </g>
    <g class="ln" style="animation-delay:2.8s">
      <tspan x="58" y="384" fill="#94a3b8">     Memory: </tspan>
      <tspan fill="#22d3ee">∞</tspan>
      <tspan fill="#94a3b8">  / infinite curiosity</tspan>
    </g>

    <!-- Line 4: prompt with caret -->
    <g class="ln gp" style="animation-delay:3.1s">
      <tspan x="58" y="428" fill="#22d3ee" font-weight="bold">skismail57@github</tspan>
      <tspan fill="#6b7b8f">:</tspan>
      <tspan fill="#8b5cf6" font-weight="bold">~</tspan>
      <tspan fill="#6b7b8f">$ </tspan>
      <tspan class="cur" fill="#c9d1d9" font-weight="bold">▊</tspan>
    </g>
  </g>

  <!-- Bottom status bar -->
  <rect x="30" y="468" width="840" height="22" rx="0" fill="#05080f"/>
  <rect x="30" y="468" width="840" height="22" rx="14" fill="none" stroke="#1c2b3d" stroke-width="0.5"/>
  <text x="48" y="484" font-size="11" fill="#4ade80">utf-8</text>
  <text x="110" y="484" font-size="11" fill="#22d3ee">zsh 5.9</text>
  <text x="200" y="484" font-size="11" fill="#8b5cf6">λ master</text>
  <text x="310" y="484" font-size="11" fill="#fbbf24">📂 6 files</text>
  <text x="440" y="484" font-size="11" fill="#7dd3fc">⚡ 99% uptime</text>
  <text x="780" y="484" text-anchor="end" font-size="11" fill="#94a3b8">Ln 12, Col 1  </text>
  <text x="840" y="484" text-anchor="end" font-size="11" fill="#60a5fa">⚙ 1.0.0</text>

  <g clip-path="url(#cc)" style="pointer-events:none">
    <rect class="sh" x="0" y="0" width="240" height="520" fill="url(#shineg)"/>
  </g>
</svg>
