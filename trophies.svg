<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="900" height="210" role="img" aria-label="Trophies">
  <defs>
    <style><![CDATA[
      text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      @keyframes popIn{0%{opacity:0;transform:translateY(14px) scale(.7)}70%{opacity:1;transform:translateY(-3px) scale(1.06)}100%{opacity:1;transform:translateY(0) scale(1)}}
      @keyframes shine{0%{transform:translateX(-940px) skewX(-18deg)}55%,100%{transform:translateX(940px) skewX(-18deg)}}
      @keyframes trophyGlow{0%,100%{filter:drop-shadow(0 0 6px #fbbf2488)}50%{filter:drop-shadow(0 0 14px #fbbf24cc)}}
      @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      .t{opacity:0;animation:popIn .6s cubic-bezier(.2,.8,.3,1.3) forwards;transform-box:fill-box;transform-origin:center bottom}
      .g{animation:trophyGlow 3s ease-in-out infinite}
      .sh{animation:shine 6s ease-in-out infinite}
      .fl{animation:floaty 4s ease-in-out infinite}
    ]]></style>
    <linearGradient id="titleg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"><animate attributeName="stop-color" values="#22d3ee;#8b5cf6;#22d3ee" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="100%"><animate attributeName="stop-color" values="#8b5cf6;#22d3ee;#8b5cf6" dur="7s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="goldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="silverg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="50%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#6b7280"/>
    </linearGradient>
    <linearGradient id="bronzeg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".08"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1424"/><stop offset="100%" stop-color="#080f1c"/>
    </linearGradient>
    <clipPath id="cc"><rect x="1" y="1" width="898" height="208" rx="16"/></clipPath>
  </defs>

  <rect x="1" y="1" width="898" height="208" rx="16" fill="url(#cardg)" stroke="url(#titleg)" stroke-width="1.5"/>
  <text x="28" y="36" font-size="16" font-weight="bold" fill="url(#titleg)">🏆 Achievements &amp; Trophies</text>

  <!-- Trophy 1: Multi Star (Gold) - x=85 -->
  <g class="t" style="animation-delay:.3s">
    <g class="g fl" style="animation-delay:.1s">
      <path d="M85 170 L95 170 L95 160 L75 160 L75 170 Z" fill="url(#bronzeg)"/>
      <path d="M72 160 L98 160 L100 148 L70 148 Z" fill="url(#silverg)"/>
      <path d="M85 55 L92 80 L118 82 L98 98 L104 124 L85 110 L66 124 L72 98 L52 82 L78 80 Z" fill="url(#goldg)" stroke="#92400e" stroke-width="1"/>
      <circle cx="85" cy="92" r="8" fill="#fef3c7" opacity=".8"/>
      <text x="85" y="140" text-anchor="middle" font-size="10" font-weight="bold" fill="#fde68a">⭐ Star</text>
    </g>
  </g>

  <!-- Trophy 2: Commit Cup (Gold) - x=210 -->
  <g class="t" style="animation-delay:.5s">
    <g class="g fl" style="animation-delay:.3s">
      <path d="M210 170 L220 170 L220 160 L200 160 L200 170 Z" fill="url(#bronzeg)"/>
      <path d="M197 160 L223 160 L225 148 L195 148 Z" fill="url(#silverg)"/>
      <path d="M188 82 Q188 62 210 62 Q232 62 232 82 L232 132 Q232 148 210 148 Q188 148 188 132 Z" fill="url(#goldg)" stroke="#92400e" stroke-width="1"/>
      <path d="M232 88 Q248 88 248 104 Q248 120 232 120" fill="none" stroke="url(#goldg)" stroke-width="6"/>
      <path d="M188 88 Q172 88 172 104 Q172 120 188 120" fill="none" stroke="url(#goldg)" stroke-width="6"/>
      <circle cx="210" cy="105" r="12" fill="#fef3c7" opacity=".7"/>
      <text x="210" y="109" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">💻</text>
      <text x="210" y="140" text-anchor="middle" font-size="10" font-weight="bold" fill="#fde68a">Commit</text>
    </g>
  </g>

  <!-- Trophy 3: Repo Medal (Silver) - x=335 -->
  <g class="t" style="animation-delay:.7s">
    <g class="fl" style="animation-delay:.5s;animation:trophyGlow 3.2s ease-in-out .1s infinite, floaty 4s ease-in-out .2s infinite">
      <path d="M335 170 L345 170 L345 160 L325 160 L325 170 Z" fill="url(#bronzeg)"/>
      <path d="M322 160 L348 160 L350 148 L320 148 Z" fill="url(#silverg)"/>
      <circle cx="335" cy="100" r="42" fill="url(#silverg)" stroke="#4b5563" stroke-width="1.5"/>
      <circle cx="335" cy="100" r="32" fill="#1f2937"/>
      <path d="M320 100 L330 110 L352 88" fill="none" stroke="#e5e7eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="335" y="140" text-anchor="middle" font-size="10" font-weight="bold" fill="#e5e7eb">📦 Repo</text>
    </g>
  </g>

  <!-- Trophy 4: Follower Gem (Gold) - x=460 -->
  <g class="t" style="animation-delay:.9s">
    <g class="g fl" style="animation-delay:.7s">
      <path d="M460 170 L470 170 L470 160 L450 160 L450 170 Z" fill="url(#bronzeg)"/>
      <path d="M447 160 L473 160 L475 148 L445 148 Z" fill="url(#silverg)"/>
      <polygon points="460,62 482,82 476,118 444,118 438,82" fill="url(#goldg)" stroke="#92400e" stroke-width="1"/>
      <polygon points="460,62 482,82 460,90 438,82" fill="#fef3c7" opacity=".6"/>
      <circle cx="460" cy="95" r="10" fill="#fff" opacity=".6"/>
      <text x="460" y="99" text-anchor="middle" font-size="11">👥</text>
      <text x="460" y="140" text-anchor="middle" font-size="10" font-weight="bold" fill="#fde68a">Follow</text>
    </g>
  </g>

  <!-- Trophy 5: Issue Shield (Bronze) - x=585 -->
  <g class="t" style="animation-delay:1.1s">
    <g class="fl" style="animation-delay:.9s;animation:trophyGlow 3.4s ease-in-out .2s infinite, floaty 4s ease-in-out .4s infinite">
      <path d="M585 170 L595 170 L595 160 L575 160 L575 170 Z" fill="url(#bronzeg)"/>
      <path d="M572 160 L598 160 L600 148 L570 148 Z" fill="url(#silverg)"/>
      <path d="M585 60 L610 68 L610 108 Q610 128 585 138 Q560 128 560 108 L560 68 Z" fill="url(#bronzeg)" stroke="#7c2d12" stroke-width="1.2"/>
      <path d="M585 70 L600 76 L600 108 Q600 122 585 130 Q570 122 570 108 L570 76 Z" fill="#1c1917" opacity=".5"/>
      <circle cx="585" cy="95" r="10" fill="#fef3c7" opacity=".6"/>
      <text x="585" y="99" text-anchor="middle" font-size="11">🐛</text>
      <text x="585" y="140" text-anchor="middle" font-size="10" font-weight="bold" fill="#fdba74">Issue</text>
    </g>
  </g>

  <!-- Trophy 6: PR Lightning (Gold) - x=710 -->
  <g class="t" style="animation-delay:1.3s">
    <g class="g fl" style="animation-delay:1.1s">
      <path d="M710 170 L720 170 L720 160 L700 160 L700 170 Z" fill="url(#bronzeg)"/>
      <path d="M697 160 L723 160 L725 148 L695 148 Z" fill="url(#silverg)"/>
      <path d="M722 62 L700 96 L712 96 L698 132 L726 90 L714 90 Z" fill="url(#goldg)" stroke="#92400e" stroke-width="1"/>
      <circle cx="710" cy="95" r="10" fill="#fff" opacity=".5"/>
      <text x="710" y="99" text-anchor="middle" font-size="11">⚡</text>
      <text x="710" y="140" text-anchor="middle" font-size="10" font-weight="bold" fill="#fde68a">PullReq</text>
    </g>
  </g>

  <!-- Trophy 7: AI Brain (Violet) - x=835 -->
  <g class="t" style="animation-delay:1.5s">
    <g class="fl" style="animation-delay:1.3s;animation:trophyGlow 3.6s ease-in-out .3s infinite, floaty 4s ease-in-out .6s infinite">
      <path d="M835 170 L845 170 L845 160 L825 160 L825 170 Z" fill="url(#bronzeg)"/>
      <path d="M822 160 L848 160 L850 148 L820 148 Z" fill="url(#silverg)"/>
      <path d="M822 78 Q815 62 835 62 Q860 62 852 82 Q868 86 862 104 Q868 120 850 122 L850 130 Q850 134 846 134 L824 134 Q820 134 820 130 L820 122 Q802 120 808 104 Q802 86 818 82 Z" fill="#8b5cf6" stroke="#5b21b6" stroke-width="1.2"/>
      <path d="M835 70 L835 126 M824 84 L846 84 M826 96 L844 96 M828 108 L842 108" stroke="#c4b5fd" stroke-width="1.2" opacity=".6"/>
      <text x="835" y="140" text-anchor="middle" font-size="10" font-weight="bold" fill="#c4b5fd">🤖 AI</text>
    </g>
  </g>

  <g clip-path="url(#cc)" style="pointer-events:none">
    <rect class="sh" x="0" y="0" width="260" height="210" fill="url(#shineg)"/>
  </g>
</svg>
