name: Generate Snake SVG

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate github-snake-dark.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Skismail57
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push dist to output branch
        uses: crazy-max/ghaction-github-pages@v4.1.1
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
